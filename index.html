<!DOCTYPE html>
<html>
<head>
    <title>Wifi Password Viewer</title>
</head>
<body>
    <div id="results"></div>

    <script src="https://code.jquery.com/jquery-1.9.1.min.js"></script>
    <script src="wifi-password/wifi-password.js"></script>
    <script>
        $(document).ready(function() {
            function showWifiInfo(wifiList) {
                let html = '<h2>Wi-Fi Networks:</h2>';
                wifiList.forEach(function(wifi) {
                    html += `<p>${wifi.ssid}</p>`;
                });
                $('#results').html(html);
            }

            // Get all connected networks
            WifiPassword.getWifiInfo().then(function(wifiList) {
                showWifiInfo(wifiList);
            }).catch(function(error) {
                console.error('Error:', error);
            });
        });
    </script>
</body>
</html>
